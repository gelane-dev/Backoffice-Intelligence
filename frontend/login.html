<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Acesso ao Backoffice Intelligence — sistema de consolidação e validação de operações financeiras." />
  <title>Entrar · Backoffice Intelligence</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="kicker">Backoffice Intelligence</div>
      <h1>Acesso operacional</h1>
      <p class="hint">Projeto independente com dados fictícios.<br>Inspirado em rotinas de backoffice financeiro.</p>

      <form id="form">
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input id="email" name="email" type="email" placeholder="E-mail" value="admin@backoffice.local" required />
        </div>
        <div class="input-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="senha" name="senha" type="password" placeholder="Senha" value="admin123" required />
        </div>
        <button class="btn" type="submit" id="btn-login">
          <span>Entrar</span>
          <div class="spinner"></div>
        </button>
        <div class="msg" id="msg"></div>
      </form>

      <div class="login-footer">
        <p class="hint" style="margin-bottom: 4px">
          <strong style="color: var(--text-2)">admin@backoffice.local</strong> / admin123<br>
          <strong style="color: var(--text-2)">operador@backoffice.local</strong> / operador123
        </p>
        <small>v0.1.0 · MVP com dados fictícios</small>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn-login");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.classList.add("loading");
      btn.disabled = true;
      try {
        const data = await api("/auth/login-json", {
          method: "POST",
          body: JSON.stringify({
            email: form.email.value,
            senha: form.senha.value,
          }),
        });
        localStorage.setItem(TOKEN_KEY, data.access_token);
        localStorage.setItem(USER_KEY, JSON.stringify({ nome: data.nome, perfil: data.perfil }));
        showToast("Login realizado com sucesso!", "success");
        setTimeout(() => (window.location.href = "/"), 400);
      } catch (err) {
        msg.textContent = err.message;
        btn.classList.remove("loading");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
