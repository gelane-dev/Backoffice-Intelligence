services:
  db:
    image: postgres:16-alpine
    container_name: backoffice_pg
    environment:
      POSTGRES_USER: backoffice
      POSTGRES_PASSWORD: backoffice
      POSTGRES_DB: backoffice_intelligence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice -d backoffice_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
